<main class="page">
  <header class="hero">
    <p class="eyebrow">ANGULAR + AEM PORTFOLIO</p>
    <h1>{{ pageTitle }}</h1>
    <p>Reusable digital experiences powered by Angular.</p>
  </header>

  <section class="status" *ngIf="loading" role="status">
    <span class="loader" aria-hidden="true"></span>
    <p>Loading page content...</p>
  </section>

  <section class="status error" *ngIf="!loading && error" role="alert">
    <h2>Content unavailable</h2>
    <p>{{ error }}</p>
    <button type="button" (click)="reloadContent()">Try again</button>
  </section>

  <section
    class="empty-state"
    *ngIf="!loading && !error && cards.length === 0">
    <h2>No content available</h2>
    <p>There are currently no cards to display.</p>
  </section>

  <section
    class="card-grid"
    *ngIf="!loading && !error && cards.length > 0"
    aria-label="Featured content">
    <app-content-card
      *ngFor="let card of cards"
      [title]="card.cardTitle"
      [description]="card.cardDesc"
      [componentType]="card[':type']">
    </app-content-card>
  </section>

  <footer class="page-footer">
    <p>Demo project · Angular frontend with an AEM-style JSON content model</p>
  </footer>
</main>
